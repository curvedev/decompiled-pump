[package]
name = "depump"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Independent experimental Solana devnet launchpad"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
borsh = { version = "=1.5.7", features = ["derive"] }
solana-program = "=2.3.0"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
